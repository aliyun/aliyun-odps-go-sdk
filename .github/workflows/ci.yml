name: CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      release_check:
        description: Require the SDK release coverage thresholds
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_check:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test using MaxCompute Emulator
        env:
          RELEASE_CHECK: ${{ inputs.release_check }}
          SDK_TEST_REPORT_DIR: ${{ runner.temp }}/sdk-tests
        run: |
          args=()
          if [[ "$RELEASE_CHECK" == "true" ]]; then
            args+=(--release)
          fi
          bash scripts/test-emulator.sh "${args[@]}"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-coverage
          path: |
            ${{ runner.temp }}/sdk-tests/**/go.cover
            ${{ runner.temp }}/sdk-tests/**/*.branches.json
            ${{ runner.temp }}/sdk-tests/**/*.branches.log
