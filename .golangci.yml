version: "2"
run:
  timeout: 5m
  go: "1.15"
  modules-download-mode: readonly
  tests: false
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
  settings:
    revive:
      rules:
        - name: var-naming
          disabled: true
    staticcheck:
      checks:
        - all
        - -SA1019
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new-from-rev: master
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aliyun/aliyun-odps-go-sdk
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
